<h2 mat-dialog-title>Upload Resume</h2>

<mat-dialog-content>

  <input
    type="file"
    accept=".pdf,.doc,.docx"
    (change)="onFileSelected($event)">

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-button mat-dialog-close>
    Cancel
  </button>

  <button
    mat-raised-button
    color="primary"
    (click)="upload()">

    Upload

  </button>

</mat-dialog-actions>
