<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        ResumeIQ
      </mat-card-title>

      <mat-card-subtitle>
        Sign in to continue
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password">

          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword">

            <mat-icon>

              {{ hidePassword ? 'visibility' : 'visibility_off' }}

            </mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit">
          Login
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
