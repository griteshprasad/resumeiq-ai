<mat-card class="stat-card">

  <mat-card-content>

    <div class="icon-container">

      <mat-icon>

        {{ icon() }}

      </mat-icon>

    </div>

    <div class="content">

      <span class="title">

        {{ title() }}

      </span>

      <h2>

        {{ value() }}

      </h2>

    </div>

  </mat-card-content>

</mat-card>
